[project]
name = "tech-doc-rag"
version = "0.1.0"
description = "Technical documentation RAG application"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.14.4",
    "fastapi>=0.136.3",
    "groq>=1.4.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

